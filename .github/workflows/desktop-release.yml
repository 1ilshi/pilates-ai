name: Desktop Release

on:
  push:
    # `master` is this repository's default branch; `main` is accepted so the
    # workflow keeps working if the default is renamed.
    branches: [main, master]
    tags: ["v*"]
    # Documentation-only changes should not burn a 38-minute build matrix.
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Needed so tauri-action can create/attach assets to a GitHub release.
    permissions:
      contents: write
    # `createUpdaterArtifacts` is on, so every bundle must be signed. Keeping
    # the key at job level lets the guard below see it; an unset secret would
    # otherwise surface only as "npm run tauri build failed".
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      # A single failing platform must not cancel the other two bundles.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            onnx_platform: windows-x64
            args: --target x86_64-pc-windows-msvc
          - name: macos-arm64
            # Apple Silicon only: ONNX Runtime 1.31.1 publishes no macOS
            # x86_64 and no universal2 artifact, so a universal binary would
            # carry an arm64 dylib that cannot load on an Intel Mac.
            # `macos-14` is no longer a supported runner label ("configuration
            # 'macos-14-arm64-us-default' is not supported"); `macos-latest` is
            # Apple Silicon, and an arm64 target cross-compiles if it is not.
            os: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            onnx_platform: macos-arm64
            args: --target aarch64-apple-darwin
          - name: linux-x64
            # Pinned to 22.04 (not -latest) so the .deb/.AppImage binaries are
            # built against a glibc floor older than the runner image's. A
            # bundle built on 24.04 refuses to start on 22.04.
            os: ubuntu-22.04
            target: ""
            # Explicit rather than empty: dtolnay/rust-toolchain passes
            # `targets` straight to rustup, and an empty value is not a no-op.
            rust_targets: x86_64-unknown-linux-gnu
            onnx_platform: linux-x64
            args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libappindicator3-dev \
            libssl-dev \
            pkg-config \
            libclang-dev \
            clang \
            patchelf \
            file \
            build-essential

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `pnpm/action-setup@v4` fails on this runner ("self-installer exits with
      # code 1" — the action is forced onto Node 24 and its installer breaks),
      # so pnpm is installed from npm instead. Pinned to packageManager.
      - name: Install pnpm
        run: |
          npm install -g pnpm@12.16.1
          pnpm --version

      # Pinned rather than relying on the runner's `python`: the ONNX fetch
      # script and the Parquet verifier both run in this job.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The trailing `...` includes the desktop app's workspace dependencies,
      # notably @pilates/patient-view. A hand-written --filter list silently
      # omits it and the Vite build then fails on an unresolved import.
      - name: Build Shared Packages
        run: pnpm turbo run build --filter=@pilates/desktop...

      # ONNX Runtime shared libraries are gitignored, so a fresh checkout has
      # none. Without this step the bundle ships with no inference engine and
      # the app silently degrades at runtime.
      #
      # Wrapped so a failure puts the real message into an annotation: the
      # default annotation for a failed step is only "exit code 1", and the
      # log is not readable from an unauthenticated client.
      - name: Fetch ONNX Runtime
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/fetch.log"
          if ! python tools/fetch_onnxruntime.py --platform ${{ matrix.onnx_platform }} 2>&1 | tee "$log"; then
            echo "::error::$(tail -n 12 "$log" | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          fi

      - name: Verify ONNX Runtime library is bundled
        shell: bash
        run: |
          library=$(find apps/desktop/src-tauri/resources -maxdepth 1 \
            \( -name '*.dll' -o -name '*.dylib' -o -name '*.so' \) \
            -print -quit)
          if [ -z "$library" ]; then
            echo "::error::No .dll/.dylib/.so found in apps/desktop/src-tauri/resources"
            exit 1
          fi
          echo "Found ONNX Runtime library: $library"

      # --- Verification -------------------------------------------------
      # The Rust suite runs without a webcam, without ONNX Runtime and
      # without network: the mock pipeline feeds scripted frames through the
      # real capture path, and the live Firestore test is #[ignore]d.

      - name: Engine tests (hardware-free)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Pose definitions are in sync
        run: node tools/generate-pose-definitions.mjs --check

      - name: Visualisation smoke tests
        run: pnpm --filter @pilates/viz smoke

      - name: Parquet integrity (independent reader)
        run: |
          python -m pip install --quiet polars
          python tools/verify_parquet.py

      - name: Upload Parquet fixture
        uses: actions/upload-artifact@v4
        with:
          name: parquet-fixture-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/parquet-fixture.parquet
          if-no-files-found: error

      # Fail with one clear line instead of a cryptic bundler error.
      - name: Check updater signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add the contents of"
            echo "::error::%USERPROFILE%\\.tauri\\pilates-updater.key as a repository"
            echo "::error::secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "updater signing key present (${#TAURI_SIGNING_PRIVATE_KEY} bytes)"

      # tauri-action is not used here on purpose: its failures surface only as
      # "npm run tauri build failed", and its Node 20 runtime is deprecated.
      # Running the CLI directly also lets the real error reach an annotation.
      - name: Build and bundle desktop app
        shell: bash
        # No APPLE_* variables here on purpose: the release is unsigned, and an
        # empty APPLE_CERTIFICATE makes the macOS bundler attempt a PKCS#12
        # import and fail ("Unable to decode the provided data"). Re-add them
        # together with the real certificate secrets.
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/bundle.log"
          if ! pnpm --filter @pilates/desktop exec tauri build ${{ matrix.args }} 2>&1 | tee "$log"; then
            echo "::error::$(tail -n 25 "$log" | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.name }}
          # One glob per format: upload-artifact does not expand braces, so
          # `{nsis,msi,dmg}` silently matched nothing and every job failed here
          # after successfully building its installer.
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.sig
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build-desktop
    # Only a tagged version is published. The updater compares version numbers,
    # so the manifest must always name a build that is newer than what clinics
    # are running — publishing every master push would make "latest" a moving
    # target that is not a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          merge-multiple: true
          path: dist

      - name: List collected artifacts
        run: ls -lh dist

      # Produces latest.json (what the app downloads) and channel.json (the
      # minimum supported version). Raises `minimum` only when MINIMUM_VERSION
      # is set, which should happen only for a genuinely incompatible change.
      - name: Build update manifests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/manifest.log"
          if ! node tools/build-update-manifest.mjs dist 2>&1 | tee "$log"; then
            echo "::error::$(tail -n 15 "$log" | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "assets staged for $GITHUB_REF_NAME:"
          ls -1 release-assets

          # Capture the CLI's own message: without this a permission failure
          # (the default GITHUB_TOKEN is read-only unless the repository allows
          # write access) reports only "exit code 1".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            out=$(gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber 2>&1) \
              || { echo "::error::upload failed: ${out}"; exit 1; }
          else
            out=$(gh release create "$GITHUB_REF_NAME" \
              --title "Pilates AI $GITHUB_REF_NAME" \
              --notes "See the changelog for this version." \
              release-assets/* 2>&1) \
              || { echo "::error::create failed: ${out}"; exit 1; }
          fi
          echo "$out"

          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
